<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacVG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        .brand {
            position: fixed;
            bottom: 10px;
            right: 12px;
            z-index: 10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 999px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <iframe
        src="https://niamguy.github.io/macvg/"
        title="MacVG"
        allowfullscreen
    ></iframe>

    <div class="brand">© MacVG — made by niam</div>
</body>
</html>
